<!DOCTYPE html>

  <title>CyberGuard — Alerts</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>CyberGuard</h1>
    <p class="subtitle">Security Alerts</p>
    <nav class="nav">

      <a href="/alerts">Alerts</a>

  <main class="container">
    <section class="card">
      <h2>Alerts</h2>

        <thead>
          <tr>
            <th>Time</th><th>Signature</th><th>SID</th>

          </tr>

          <tr><td colspan="6" class="muted">No alerts yet.</td></tr>
        </tbody>
      </table>
    </section>
